<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfterGlow - Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <i class="fas fa-camera-retro"></i>
                    <span>AfterGlow</span>
                </a>
            </div>
            <div class="nav-links" id="navLinks">
                <div class="nav-search">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="global-search" placeholder="Search users...">
                    <div class="search-dropdown"></div>
                </div>
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
                <a href="upload.html"><i class="fas fa-upload"></i> Upload</a>
                <a href="profile.html" class="active" id="nav-profile-link"><i class="fas fa-user-circle"></i> Profile</a>
            </div>
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="gallery-section">
        <div class="profile-header">
            <img id="prof-pic" src="https://via.placeholder.com/150" alt="Profile" class="profile-pic">
            <div class="profile-info">
                <h1 id="prof-username">Loading...</h1>
                <div class="profile-stats">
                    <span><strong id="prof-post-count">0</strong> Posts</span>
                </div>
                <p class="bio" id="prof-bio">No bio available.</p>
                <button class="btn btn-secondary" onclick="openSettings()"><i class="fas fa-cog"></i> Edit Profile</button>
                <button class="btn btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="pin-grid" id="profile-gallery">
            <!-- Loading -->
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <h2>Edit Profile</h2>
            <form id="settings-form">
                <div class="form-group">
                    <label>Profile Picture</label>
                    <input type="file" id="set-pic" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="set-username">
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="set-bio" rows="3"></textarea>
                </div>
                <div class="settings-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Profile Loader Logic
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const targetUsername = urlParams.get('username');
            const token = localStorage.getItem('ag_token');

            let myUsername = null;
            if (token) {
                try {
                    const meRes = await fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + token }});
                    if (meRes.ok) {
                        const me = await meRes.json();
                        myUsername = me.username;
                    } else if (meRes.status === 401 || meRes.status === 403) {
                        localStorage.removeItem('ag_token');
                        window.location.href = 'auth.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
                        return;
                    }
                } catch(e) {
                    localStorage.removeItem('ag_token');
                }
            }

            // Require login ONLY if trying to view own profile directly
            if (!targetUsername && !token) {
                window.location.href = 'auth.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }

            const isOwner = !targetUsername || targetUsername === myUsername;
            let profileUser = null;
            let photos = [];

            try {
                if (isOwner) {
                    const uRes = await fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + token }});
                    if (uRes.status === 401 || uRes.status === 403) {
                        localStorage.removeItem('ag_token');
                        window.location.href = 'auth.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
                        return;
                    }
                    if (uRes.ok) profileUser = await uRes.json();
                    
                    const pRes = await fetch('/api/photos/me', { headers: { 'Authorization': 'Bearer ' + token }});
                    if (pRes.status === 401 || pRes.status === 403) {
                        localStorage.removeItem('ag_token');
                        window.location.href = 'auth.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
                        return;
                    }
                    if (pRes.ok) photos = await pRes.json();
                } else {
                    const uRes = await fetch(`/api/user/public/${targetUsername}`);
                    if (uRes.ok) profileUser = await uRes.json();
                    
                    const pRes = await fetch(`/api/photos/public/${targetUsername}`);
                    if (pRes.ok) photos = await pRes.json();
                }

                if (!profileUser) {
                    alert('User not found!');
                    window.location.href = 'gallery.html';
                    return;
                }

                // Render Profile Headers
                document.getElementById('prof-username').innerText = '@' + profileUser.username;
                document.getElementById('prof-bio').innerText = profileUser.bio || (isOwner ? 'Add a bio...' : 'No bio available.');
                if(profileUser.profile_picture_url) document.getElementById('prof-pic').src = profileUser.profile_picture_url;
                
                document.getElementById('prof-post-count').innerText = photos ? photos.length : 0;

                // Render Photos Grid
                const grid = document.getElementById('profile-gallery');
                if (photos && photos.length > 0) {
                    grid.innerHTML = photos.map(p => `
                        <div class="gallery-item pin-item">
                            <img src="${p.src}" alt="${p.title}">
                            ${isOwner ? `<button class="delete-btn" onclick="deletePhoto('${p.id}')"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<div style="color:white; grid-column: 1 / -1; text-align: center; margin-top:20px;">No photos shared yet.</div>';
                }

                // UI Controls
                if (!isOwner) {
                    // Hide Owner actions
                    const editBtn = document.querySelector('.btn-secondary[onclick="openSettings()"]');
                    const logoutBtn = document.querySelector('.btn-logout');
                    if (editBtn) editBtn.style.display = 'none';
                    if (logoutBtn) logoutBtn.style.display = 'none';
                } else {
                    // Pre-fill modal data for owner
                    document.getElementById('set-username').value = profileUser.username;
                    document.getElementById('set-bio').value = profileUser.bio || '';
                }

            } catch (err) {
                console.error("Failed to load profile", err);
            }
        });

        // Settings Logic
        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        
        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('ag_token');
            const fd = new FormData();
            fd.append('username', document.getElementById('set-username').value);
            fd.append('bio', document.getElementById('set-bio').value);
            const pic = document.getElementById('set-pic').files[0];
            if(pic) fd.append('profilePic', pic);

            await fetch('/api/user/profile', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: fd
            });
            window.location.reload();
        });

        async function deletePhoto(id) {
            if(!confirm("Remove this photo from your profile?")) return;
            const token = localStorage.getItem('ag_token');
            await fetch(`/api/photos/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            window.location.reload();
        }

        function logout() {
            localStorage.removeItem('ag_token');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
