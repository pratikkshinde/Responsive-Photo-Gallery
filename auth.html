<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfterGlow - Authentication</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <i class="fas fa-camera-retro"></i>
                    <span>AfterGlow</span>
                </a>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
                <a href="upload.html"><i class="fas fa-upload"></i> Upload</a>
                <a href="auth.html" class="active"><i class="fas fa-sign-in-alt"></i> Login</a>
            </div>
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="auth-section">
        <div class="auth-card">
            <h2 class="auth-title" id="auth-title">Welcome Back</h2>
            <div id="auth-error"></div>
            <div id="auth-message" class="auth-message"></div>
            <button id="google-signin" type="button" class="btn btn-google">
                <i class="fab fa-google"></i>
                Continue with Google
            </button>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-user" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Login</button>
                <div class="auth-toggle">
                    <a onclick="showForm('reset-form')">Forgot password?</a>
                </div>
                <div class="auth-toggle">
                    Don't have an account? <a onclick="showForm('register-form')">Sign up</a>
                </div>
            </form>

            <form id="register-form" class="auth-form" style="display:none;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="reg-username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Create Account</button>
                <div class="auth-toggle">
                    Already have an account? <a onclick="showForm('login-form')">Login</a>
                </div>
            </form>

            <form id="reset-form" class="auth-form" style="display:none;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reset-email" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Send Reset Link</button>
                <div class="auth-toggle">
                    Remembered your password? <a onclick="showForm('login-form')">Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        const nextPage = new URLSearchParams(window.location.search).get('next') || 'profile.html';

        const firebaseConfig = {
            apiKey: "AIzaSyALgK_3uFyyqXTq5-ZBFIIayqFF4QtytYM",
            authDomain: "afterglow-e34a3.firebaseapp.com",
            projectId: "afterglow-e34a3",
            storageBucket: "afterglow-e34a3.firebasestorage.app",
            messagingSenderId: "361767900984",
            measurementId: "G-7X9Z4TY95R",
            appId: "1:361767900984:web:1f83797971957b5b2f53cd"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        function showForm(formId) {
            document.getElementById('auth-error').innerText = '';
            document.getElementById('auth-message').innerText = '';
            document.getElementById('login-form').style.display = formId === 'login-form' ? 'flex' : 'none';
            document.getElementById('register-form').style.display = formId === 'register-form' ? 'flex' : 'none';
            document.getElementById('reset-form').style.display = formId === 'reset-form' ? 'flex' : 'none';
            document.getElementById('auth-title').innerText = formId === 'register-form' ? 'Create Account' : formId === 'reset-form' ? 'Reset Password' : 'Welcome Back';
        }

        function showMessage(message, type = 'error') {
            const container = document.getElementById('auth-message');
            container.innerText = message;
            container.style.color = type === 'success' ? '#34d399' : '#f97316';
        }

        document.getElementById('google-signin').addEventListener('click', async () => {
            try {
                const result = await auth.signInWithPopup(provider);
                const idToken = await result.user.getIdToken();
                const res = await fetch('/api/auth/firebase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken })
                });
                const text = await res.text();
                const contentType = res.headers.get('content-type') || '';
                if (!contentType.includes('application/json')) {
                    console.error('Non-JSON response from /api/auth/firebase:', text);
                    throw new Error('Google sign in failed: server returned non-JSON response. Check server logs or restart the server.');
                }
                const data = JSON.parse(text);
                if (res.ok) {
                    localStorage.setItem('ag_token', data.token);
                    window.location.href = nextPage;
                } else {
                    document.getElementById('auth-error').innerText = data.error || 'Google sign in failed.';
                }
            } catch (err) {
                console.error('Google sign-in error:', err);
                document.getElementById('auth-error').innerText = err.message || 'Google sign in failed.';
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-user').value;
            const pass = document.getElementById('login-password').value;
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, pass);
                if (!userCredential.user.emailVerified) {
                    showMessage('Email not verified. Please check your inbox and verify your email.', 'error');
                    return;
                }
                const idToken = await userCredential.user.getIdToken();
                const res = await fetch('/api/auth/firebase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('ag_token', data.token);
                    window.location.href = nextPage;
                } else {
                    document.getElementById('auth-error').innerText = data.error || 'Login failed.';
                }
            } catch (err) {
                console.error('Firebase login error:', err);
                document.getElementById('auth-error').innerText = err.message || 'Login failed.';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const username = document.getElementById('reg-username').value;
            const pass = document.getElementById('reg-password').value;
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                await userCredential.user.sendEmailVerification();
                const idToken = await userCredential.user.getIdToken();
                const res = await fetch('/api/auth/firebase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken })
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage('Account created. Verification email sent to ' + email + '.', 'success');
                    showForm('login-form');
                } else {
                    document.getElementById('auth-error').innerText = data.error || 'Registration failed.';
                }
            } catch (err) {
                console.error('Firebase register error:', err);
                document.getElementById('auth-error').innerText = err.message || 'Registration failed.';
            }
        });

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            try {
                await auth.sendPasswordResetEmail(email);
                showMessage('Password reset link sent to ' + email + '.', 'success');
            } catch (err) {
                console.error('Password reset error:', err);
                document.getElementById('auth-error').innerText = err.message || 'Reset link failed.';
            }
        });

        showForm('login-form');
    </script>
</body>
</html>
